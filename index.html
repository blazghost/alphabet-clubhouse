<title>Alphabet Clubhouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;600;800&display=swap">
<style>
/* ---------------------------------------------------------------
   Alphabet Clubhouse
   Andika is used for every letterform the child has to read: it is
   SIL's literacy typeface, so the 'a' and 'g' are single-story and
   the l / I / 1 are distinct -- the same manuscript print she is
   taught to form in kindergarten. Baloo 2 is chrome only.
   Single, committed visual world (construction paper on a classroom
   chalkboard), so every color is painted explicitly.
----------------------------------------------------------------*/
:root{
  --manila:#FAF3E3;
  --manila-deep:#F0E5CC;
  --board:#2F5D50;
  --board-dark:#254A40;
  --ink:#2A2622;
  --ink-soft:#6B6157;
  --poppy:#E4572E;
  --sun:#F4B942;
  --sky:#3E92CC;
  --grape:#8A5FBF;
  --grass:#58A55C;
  --star:#F6C445;
  --paper-shadow:rgba(42,38,34,.20);
  --r-tile:18px;
  --font-letter:"Andika","Trebuchet MS",Verdana,sans-serif;
  --font-ui:"Baloo 2","Andika",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:var(--manila);
  background-image:radial-gradient(circle at 18% 12%,rgba(244,185,66,.14),transparent 42%),
                   radial-gradient(circle at 84% 78%,rgba(62,146,204,.12),transparent 46%);
  color:var(--ink);
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:4px solid var(--sky);outline-offset:3px;border-radius:8px}

/* ---------- app shell ---------- */
.app{max-width:1100px;margin:0 auto;padding:18px 20px 48px;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{
  font-size:clamp(26px,4.2vw,40px);font-weight:800;margin:0;letter-spacing:-.01em;
  color:var(--board);text-wrap:balance;
}
.brand .crayon{
  display:inline-block;width:16px;height:16px;border-radius:50%;background:var(--poppy);
  box-shadow:22px 0 0 var(--sun),44px 0 0 var(--sky);margin-right:52px;
}
.stars{
  display:flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--ink);
  border-radius:999px;padding:6px 16px 6px 12px;font-weight:800;font-size:20px;
  box-shadow:0 3px 0 var(--ink);
}
.stars svg{width:24px;height:24px;flex:none}
.iconbtn{
  width:52px;height:52px;border-radius:16px;background:#fff;border:3px solid var(--ink);
  box-shadow:0 3px 0 var(--ink);display:grid;place-items:center;font-size:24px;
  transition:transform .12s ease,box-shadow .12s ease;
}
.iconbtn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}

/* ---------- home ---------- */
.shelf{display:flex;flex-direction:column;gap:12px}
.shelf-head{display:flex;align-items:center;gap:12px}
.shelf-head h2{
  font-size:15px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;
  margin:0;color:var(--ink-soft);
}
.shelf-head .rule{flex:1;height:3px;border-radius:2px;background:var(--manila-deep)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
a.card{color:inherit;text-decoration:none}
.card{
  position:relative;text-align:left;padding:18px 18px 16px;border-radius:22px;
  border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);background:#fff;
  display:flex;flex-direction:column;gap:6px;min-height:150px;
  transition:transform .14s ease,box-shadow .14s ease;
}
.card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 8px 0 var(--ink)}
.card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.card .emoji{font-size:44px;line-height:1}
.card .name{font-size:24px;font-weight:800;line-height:1.1}
.card .what{font-size:14px;font-weight:500;color:var(--ink-soft);line-height:1.3}
.card .skill{
  position:absolute;top:-11px;right:14px;font-size:11px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;padding:3px 10px;border-radius:999px;border:3px solid var(--ink);
  background:var(--sun);color:var(--ink);
}
.card.c-sky{background:#EAF4FB}.card.c-poppy{background:#FDEDE7}
.card.c-grape{background:#F2EBFA}.card.c-grass{background:#EAF5EB}
.card.c-sun{background:#FDF3DF}
.card .dots{display:flex;gap:4px;margin-top:auto}
.card .dots i{width:10px;height:10px;border-radius:50%;background:var(--manila-deep);border:2px solid rgba(42,38,34,.25)}
.card .dots i.on{background:var(--star);border-color:var(--ink)}

/* ---------- stage (inside an activity) ---------- */
.stage{
  background:var(--board);
  background-image:
    repeating-linear-gradient(115deg,rgba(255,255,255,.028) 0 2px,transparent 2px 7px),
    radial-gradient(circle at 30% 20%,rgba(255,255,255,.06),transparent 55%);
  border:4px solid var(--board-dark);border-radius:28px;
  box-shadow:inset 0 0 40px rgba(0,0,0,.28),0 6px 0 rgba(42,38,34,.35);
  padding:20px;display:flex;flex-direction:column;gap:18px;min-height:62vh;
}
.prompt{display:flex;align-items:center;gap:14px}
.prompt .say{
  flex:none;width:60px;height:60px;border-radius:50%;background:var(--sun);
  border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);display:grid;place-items:center;
  font-size:28px;
}
.prompt .say:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.prompt p{
  margin:0;font-size:clamp(20px,2.9vw,30px);font-weight:600;color:#FFF7E6;
  line-height:1.2;text-wrap:balance;
}
.prompt p b{color:var(--sun);font-family:var(--font-letter);font-weight:700}
.playarea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}

/* ---------- letter tiles ---------- */
.tilewrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;align-content:center}
.tile{
  font-family:var(--font-letter);font-weight:700;line-height:1;
  width:104px;height:104px;border-radius:var(--r-tile);display:grid;place-items:center;
  font-size:58px;background:#fff;color:var(--ink);border:4px solid var(--ink);
  box-shadow:0 5px 0 var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;
  transition:transform .12s ease,box-shadow .12s ease,background-color .2s ease;
}
.tile:hover,.tile:focus-visible{transform:translateY(-4px);box-shadow:0 9px 0 var(--ink)}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.tile.sm{width:76px;height:76px;font-size:42px;border-width:3px;box-shadow:0 4px 0 var(--ink)}
.tile.t-poppy{background:var(--poppy);color:#fff}
.tile.t-sky{background:var(--sky);color:#fff}
.tile.t-grape{background:var(--grape);color:#fff}
.tile.t-grass{background:var(--grass);color:#fff}
.tile.t-sun{background:var(--sun)}
.tile.right{animation:pop .45s ease}
.tile.wrong{animation:wobble .4s ease}
.tile.picked{outline:6px dashed var(--sun);outline-offset:4px}
.tile.ghost{opacity:.28}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22) rotate(-4deg)}100%{transform:scale(1)}}
@keyframes wobble{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}

/* ---------- shared bits ---------- */
.bigword{
  font-family:var(--font-letter);font-weight:700;color:#FFF7E6;
  font-size:clamp(36px,6vw,64px);letter-spacing:.06em;
}
.pic{font-size:clamp(78px,13vw,130px);line-height:1;filter:drop-shadow(0 8px 0 rgba(0,0,0,.22))}
.hint{color:#CFE3DC;font-size:16px;font-weight:600}
.pill{
  background:#fff;border:3px solid var(--ink);border-radius:999px;padding:8px 18px;
  font-weight:800;font-size:18px;box-shadow:0 4px 0 var(--ink);
}
.pill:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
.progress{display:flex;gap:7px;justify-content:center}
.progress i{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.2);border:3px solid rgba(255,255,255,.45)}
.progress i.on{background:var(--star);border-color:#fff}

/* ---------- celebration ---------- */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.cheer{
  position:fixed;inset:0;display:grid;place-items:center;z-index:61;pointer-events:none;
}
.cheer .inner{
  background:#fff;border:5px solid var(--ink);border-radius:32px;box-shadow:0 10px 0 var(--ink);
  padding:28px 44px;text-align:center;animation:pop .5s ease;
}
.cheer h3{margin:0;font-size:44px;font-weight:800;color:var(--board)}
.cheer p{margin:6px 0 0;font-size:20px;font-weight:600;color:var(--ink-soft)}

/* ---------- sheets (settings / grown-ups) ---------- */
.scrim{position:fixed;inset:0;background:rgba(42,38,34,.55);z-index:70;display:grid;place-items:center;padding:20px}
.sheet{
  background:var(--manila);border:5px solid var(--ink);border-radius:28px;box-shadow:0 10px 0 var(--ink);
  max-width:620px;width:100%;max-height:86vh;overflow-y:auto;padding:26px;
}
.sheet h2{margin:0 0 4px;font-size:30px;font-weight:800;color:var(--board)}
.sheet .sub{margin:0 0 18px;color:var(--ink-soft);font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:3px dotted var(--manila-deep);flex-wrap:wrap}
.row:last-of-type{border-bottom:none}
.row .lab{font-weight:800;font-size:18px;margin-right:auto}
.seg{display:flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
input.pill{max-width:190px;font-size:17px;font-weight:700}
input.pill::placeholder{color:#B8AC98;font-weight:600}
select.pill{max-width:100%;appearance:none;-webkit-appearance:none;padding-right:34px;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
  background-position:calc(100% - 19px) 19px,calc(100% - 13px) 19px;background-size:6px 6px,6px 6px;background-repeat:no-repeat}
.notice{background:#FDF3DF;border:3px solid var(--sun);border-radius:16px;padding:12px 14px;font-size:15px;line-height:1.5;font-weight:600}
.notice code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#fff;border:2px solid var(--manila-deep);border-radius:6px;padding:1px 6px;font-size:14px}
.seg button{padding:8px 16px;font-weight:800;font-size:16px;font-family:var(--font-letter)}
.seg button[aria-pressed="true"]{background:var(--board);color:#FFF7E6}
.grid26{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin-top:6px}
.grid26 span{
  font-family:var(--font-letter);font-weight:700;font-size:24px;text-align:center;padding:6px 0;
  border-radius:12px;background:#fff;border:3px solid var(--manila-deep);color:#C8BCA8;
}
.grid26 span.done{background:var(--grass);border-color:var(--ink);color:#fff}
.tips{font-size:16px;line-height:1.55;color:var(--ink)}
.tips li{margin-bottom:9px}
.footnote{
  text-align:center;color:var(--ink-soft);font-weight:600;font-size:14px;
  display:flex;gap:16px;justify-content:center;flex-wrap:wrap;
}
.footnote button{text-decoration:underline;font-weight:800}
.hidden{display:none!important}

/* ---------- games ---------- */
#bubbleCanvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.bubblebox{position:relative;width:100%;flex:1;min-height:340px}
.bins{display:flex;gap:22px;justify-content:center;width:100%;flex-wrap:wrap}
.bin{
  flex:1;min-width:190px;max-width:300px;min-height:170px;border-radius:24px;border:5px dashed rgba(255,255,255,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:12px;
  transition:background-color .15s ease,border-color .15s ease,transform .15s ease;
}
.bin.over{background:rgba(246,196,69,.25);border-color:var(--sun);transform:scale(1.03)}
.bin h4{margin:0;font-size:20px;font-weight:800;color:#FFF7E6;font-family:var(--font-letter)}
.bin .caught{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.dragging{position:fixed;z-index:80;pointer-events:none;transform:translate(-50%,-50%) scale(1.1) rotate(-3deg)}
.door{
  width:132px;height:150px;border-radius:14px 14px 8px 8px;background:var(--poppy);
  border:5px solid var(--ink);box-shadow:0 6px 0 var(--ink);position:relative;display:grid;place-items:center;
  font-size:54px;transition:transform .2s ease,background-color .25s ease;
}
.door::after{content:"";position:absolute;right:14px;top:50%;width:13px;height:13px;border-radius:50%;background:var(--sun);border:3px solid var(--ink)}
.door.open{background:#FFF7E6;transform:rotateY(0deg)}
.door.open::after{display:none}
.door.half{background:#EE8A63}
.slots{display:flex;gap:12px}
.slot{
  width:104px;height:104px;border-radius:var(--r-tile);border:5px dashed rgba(255,255,255,.6);
  display:grid;place-items:center;font-family:var(--font-letter);font-size:58px;font-weight:700;color:#FFF7E6;
}
.slot.over{background:rgba(246,196,69,.25);border-color:var(--sun)}
.slot.filled{border-style:solid;background:#fff;color:var(--ink);border-color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.3)}
.scrollbox{
  width:min(340px,90%);height:330px;overflow-y:auto;background:#FFF7E6;border:5px solid var(--ink);
  border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;
}
.tracebox{display:flex;flex-direction:column;align-items:center;gap:10px}
.tracesvg{background:#FFF7E6;border:5px solid var(--ink);border-radius:22px;touch-action:none;box-shadow:0 6px 0 rgba(0,0,0,.3)}
.tracesvg .guide{stroke:#E2D6BC;stroke-width:44;stroke-linecap:round;stroke-linejoin:round;fill:none}
.tracesvg .dash{stroke:#B9A98A;stroke-width:4;stroke-linecap:round;fill:none;stroke-dasharray:2 16}
.tracesvg .done-stroke{stroke:var(--grass);stroke-width:26;stroke-linecap:round;stroke-linejoin:round;fill:none}
.tracesvg .ink{stroke:var(--poppy);stroke-width:26;stroke-linecap:round;stroke-linejoin:round;fill:none}
.tracesvg .startdot{fill:var(--grass);stroke:var(--ink);stroke-width:4}
.tracesvg .endflag{fill:var(--sky);stroke:var(--ink);stroke-width:4}

@media (max-width:640px){
  .app{padding:14px 14px 34px}
  .tile{width:84px;height:84px;font-size:46px}
  .slot{width:84px;height:84px;font-size:46px}
  .stage{padding:14px;border-radius:22px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

/* ---------- Pip: the owl who does the talking ---------- */
.pip{display:block;overflow:visible}
.pip .wing{transform-box:fill-box;transform-origin:top center;transition:transform .25s ease}
.pip .eye{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
.pip .eye.r{animation-delay:.08s}
.pip .pupil{transform-box:fill-box;transform-origin:center;transition:transform .3s ease}
.pip .brow{opacity:0;transition:opacity .2s ease}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.12)}}
.pipwrap{display:inline-block;transform-origin:bottom center;animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
.pipwrap.happy{animation:hop .55s ease}
.pipwrap.happy .wing{transform:rotate(-38deg)}
.pipwrap.happy .pupil{transform:translateY(-2px) scale(1.12)}
.pipwrap.oops{animation:tilt .6s ease}
.pipwrap.oops .brow{opacity:1}
.pipwrap.oops .pupil{transform:translateY(2px)}
.pipwrap.party{animation:hop .45s ease 4}
.pipwrap.party .wing{transform:rotate(-52deg)}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-16px) scale(1.06)}60%{transform:translateY(0) scale(.96,1.04)}}
@keyframes tilt{0%,100%{transform:rotate(0)}30%{transform:rotate(-7deg)}65%{transform:rotate(5deg)}}

/* Pip is the replay button on the stage: tapping him says it again */
.prompt .say{
  background:transparent;border:none;box-shadow:none;border-radius:18px;
  width:96px;height:96px;padding:0;overflow:visible;position:relative;
}
.prompt .say:active{transform:translateY(3px);box-shadow:none}
.prompt .say .pipwrap{display:block}
.prompt .say .pip{width:88px;height:88px}
.prompt .say::after{
  content:"🔊";position:absolute;right:-2px;bottom:0;font-size:15px;background:#fff;
  border:3px solid var(--ink);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;
}

/* ---------- welcome band ---------- */
.welcome{
  display:flex;align-items:center;gap:16px;background:#fff;border:4px solid var(--ink);
  border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:14px 20px 14px 14px;margin-bottom:22px;
}
.welcome .pipwrap{flex:none}
.welcome .pip{width:84px;height:84px}
.bubble{
  position:relative;background:var(--manila);border:3px solid var(--ink);border-radius:20px;
  padding:12px 18px;font-size:clamp(17px,2.3vw,22px);font-weight:600;line-height:1.3;flex:1;text-wrap:balance;
}
.bubble::before{
  content:"";position:absolute;left:-13px;top:26px;width:0;height:0;
  border:10px solid transparent;border-right-color:var(--ink);border-left:0;
}
.bubble::after{
  content:"";position:absolute;left:-8px;top:27px;width:0;height:0;
  border:9px solid transparent;border-right-color:var(--manila);border-left:0;
}
.welcome .again{flex:none}

/* ---------- sticker book ---------- */
.stickers{
  display:flex;flex-wrap:wrap;gap:10px;background:#fff;border:4px dashed var(--manila-deep);
  border-radius:22px;padding:14px;min-height:74px;align-items:center;
}
.stickers .sticker{
  font-size:34px;line-height:1;width:48px;height:48px;display:grid;place-items:center;
  background:var(--manila);border:3px solid var(--ink);border-radius:50%;box-shadow:0 3px 0 var(--ink);
  transform:rotate(var(--tilt,0deg));
}
.stickers .sticker.fresh{animation:slam .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes slam{0%{transform:scale(2.6) rotate(-22deg);opacity:0}60%{transform:scale(.92) rotate(var(--tilt,0deg));opacity:1}100%{transform:scale(1) rotate(var(--tilt,0deg))}}
.stickers .empty{color:var(--ink-soft);font-weight:600;font-size:15px;padding:0 6px}
.stickers .next{
  margin-left:auto;font-size:14px;font-weight:800;color:var(--ink-soft);
  display:flex;align-items:center;gap:7px;padding-right:4px;
}
.meter{width:92px;height:14px;border:3px solid var(--ink);border-radius:999px;background:var(--manila-deep);overflow:hidden}
.meter i{display:block;height:100%;background:var(--star);border-radius:999px;transition:width .5s cubic-bezier(.2,1.3,.4,1)}

/* ---------- stuck-on-paper cards ---------- */
.card:nth-child(3n+1){transform:rotate(-1.1deg)}
.card:nth-child(3n+2){transform:rotate(.7deg)}
.card:nth-child(3n+3){transform:rotate(-.4deg)}
.card:hover,.card:focus-visible{transform:translateY(-4px) rotate(0deg) scale(1.02)}
.card:active{transform:translateY(4px) rotate(0deg) scale(.99)}

/* ---------- a star that flies home ---------- */
.flystar{
  position:fixed;z-index:90;pointer-events:none;font-size:34px;line-height:1;
  transition:transform .72s cubic-bezier(.4,0,.5,1),opacity .72s ease;
}
.stars.bump{animation:bump .42s ease}
@keyframes bump{0%,100%{transform:scale(1)}45%{transform:scale(1.25) rotate(-5deg)}}

/* ---------- livelier tiles ---------- */
.tile:hover,.tile:focus-visible{transform:translateY(-5px) rotate(-2deg);box-shadow:0 10px 0 var(--ink)}
.tile:active{transform:translateY(5px) scale(.96);box-shadow:0 1px 0 var(--ink)}
.door:hover{transform:translateY(-4px) rotate(-1.5deg)}
@media (prefers-reduced-motion:reduce){
  .pipwrap,.pip .eye{animation:none!important}
}

/* ---------- "your turn" — the wait is the whole point ---------- */
.turnbadge{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:63;
  background:var(--sun);border:5px solid var(--ink);border-radius:999px;
  box-shadow:0 6px 0 var(--ink);padding:12px 26px;display:flex;align-items:center;gap:14px;
  font-size:clamp(20px,3vw,28px);font-weight:800;animation:turnpulse 1.05s ease-in-out infinite;
}
@keyframes turnpulse{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.055)}}
.turnbar{display:block;width:96px;height:14px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.turnbar i{display:block;height:100%;width:0;background:var(--poppy);border-radius:999px;animation:turnfill linear forwards}
@keyframes turnfill{from{width:0}to{width:100%}}
.pipwrap.listening{animation:lean 1.15s ease-in-out infinite}
.pipwrap.listening .pupil{transform:translateY(-2px) scale(1.18)}
@media (prefers-reduced-motion:reduce){.turnbadge,.turnbar i{animation:none!important}}

/* ---------- the reading path: stepping stones, not a menu ---------- */
.path{display:flex;gap:0;align-items:stretch;flex-wrap:wrap}
.step{
  position:relative;flex:1;min-width:150px;background:none;padding:10px 8px 12px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
}
.step::before{
  content:"";position:absolute;left:-50%;right:50%;top:44px;height:6px;
  background:repeating-linear-gradient(90deg,var(--manila-deep) 0 10px,transparent 10px 20px);z-index:0;
}
.step:first-child::before{display:none}
.stone{
  position:relative;z-index:1;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
  border:4px solid var(--ink);box-shadow:0 5px 0 var(--ink);background:#fff;
  font-size:26px;font-weight:800;transition:transform .15s ease,box-shadow .15s ease;
}
.step:hover .stone{transform:translateY(-4px) scale(1.05);box-shadow:0 9px 0 var(--ink)}
.step:active .stone{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.stone.on{background:var(--sun)}
.stone.done{background:var(--grass);color:#fff}
.stone.locked{background:var(--manila-deep);border-color:#B9A98A;box-shadow:0 5px 0 #B9A98A;color:#8C7F68}
.step .lets{
  font-family:var(--font-letter);font-weight:700;font-size:19px;letter-spacing:.1em;color:var(--ink);
  background:#fff;border:3px solid var(--ink);border-radius:999px;padding:3px 12px;
}
.step.locked .lets{opacity:.45}
.step .cap{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.coach{
  background:#EAF4FB;border:3px solid var(--sky);border-radius:16px;padding:10px 14px;
  font-size:15px;font-weight:600;line-height:1.45;color:var(--ink);max-width:620px;
}
.coach b{color:#1F6FA8}

/* ---------- blending: sounds stretched under a swoop ---------- */
.blend{display:flex;flex-direction:column;align-items:center;gap:2px}
.blendrow{display:flex;gap:10px}
.blendrow .tile{transition:transform .18s ease,background-color .18s ease,color .18s ease}
.blendrow .tile.lit,.slot.lit,.tile.lit{transform:translateY(-10px) scale(1.14);background:var(--sun);color:var(--ink);border-color:var(--ink)}
.blendrow .tile.all,.slot.all,.tile.all{background:var(--grass);color:#fff;border-style:solid;border-color:var(--ink)}
.swoop{display:block;height:42px}
.swoop path{fill:none;stroke:var(--sun);stroke-width:6;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len)}
.swoop path.go{transition:stroke-dashoffset var(--dur,1.6s) linear;stroke-dashoffset:0}
.swoop circle{fill:var(--poppy);stroke:var(--ink);stroke-width:3}

/* ---------- the decodable reader ---------- */
.reader{
  background:#FFF7E6;border:5px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 rgba(0,0,0,.3);
  padding:28px 32px;max-width:720px;display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center;
}
.rword{
  font-family:var(--font-letter);font-weight:700;font-size:clamp(34px,6vw,54px);color:var(--ink);
  background:none;padding:2px 8px;border-radius:12px;line-height:1.2;transition:background-color .2s ease,transform .2s ease;
}
.rword:hover{background:#F6E3B8}
.rword.lit{background:var(--sun);transform:scale(1.08)}
.rword.read{color:var(--grass)}
.phase{display:flex;gap:8px;align-items:center;justify-content:center}
.phase i{
  width:34px;height:10px;border-radius:999px;background:rgba(255,255,255,.22);
  border:2px solid rgba(255,255,255,.4);
}
.phase i.on{background:var(--star);border-color:#fff}
</style>

  {w:"bus",emoji:"🚌"},{w:"hat",emoji:"🎩"},{w:"net",emoji:"🥅"},{w:"cup",emoji:"☕"},
  {w:"bed",emoji:"🛏️"},{w:"map",emoji:"🗺️"},{w:"fox",emoji:"🦊"},{w:"jam",emoji:"🍓"},

/* =====================================================================
   SPEECH  — nothing on screen requires reading, so this does the work.
   ===================================================================== */
let voice = null, voiceReady = false, voiceList = [];
/* Which voice gets picked matters more than anything else here. Modern
   neural voices ("Natural", "Online", "Enhanced") sound human; the old
   formant synths (eSpeak, Festival, Pico, the legacy SAPI "Desktop"
   voices) are the ones that sound like a robot. Rank, do not guess. */
const V_GREAT = /(natural|neural|online|enhanced|premium|siri)/i;
const V_POOR  = /(espeak|festival|pico|flite|eloquence|compact|robo)/i;
const V_NAMED = ["Google US English","Google UK English Female","Samantha","Ava","Allison",
                 "Aria","Jenny","Michelle","Sonia","Libby","Emma","Karen","Moira","Serena","Joanna","Nicky"];
function scoreVoice(v){
  let sc = 0;
  const nm = v.name || "";
  if(V_GREAT.test(nm)) sc += 45;
  if(V_NAMED.some(x => nm.includes(x))) sc += 30;
  if(V_POOR.test(nm)) sc -= 70;
  if(/desktop/i.test(nm)) sc -= 20;        /* legacy SAPI5 */
  if(v.localService === false) sc += 18;   /* network voices are usually the neural ones */
  const lang = (v.lang || "").replace("_","-");
  if(/^en-US/i.test(lang)) sc += 25;
  else if(/^en-(GB|AU|CA|IE|NZ)/i.test(lang)) sc += 16;
  else if(/^en/i.test(lang)) sc += 8;
  else sc -= 45;
  if(/female|woman/i.test(nm)) sc += 14;   /* warmer for a small child */
  if(/(samantha|aria|jenny|libby|sonia|ava|allison|joanna|karen|michelle|emma)/i.test(nm)) sc += 10;
  return sc;
}
function rankedVoices(){
  const vs = ("speechSynthesis" in window) ? speechSynthesis.getVoices() : [];
  return vs.slice().map(v => ({v, sc: scoreVoice(v)}))
           .sort((a,b) => b.sc - a.sc).map(o => o.v);
}
function chooseVoice(){
  voiceList = rankedVoices();
  if(!voiceList.length){ voice = null; return; }
  voice = (S.voiceName && voiceList.find(v => v.name === S.voiceName)) || voiceList[0];
  voiceReady = true;
}
if("speechSynthesis" in window){
  chooseVoice();
  speechSynthesis.onvoiceschanged = chooseVoice;
}
let speakQueue = Promise.resolve();
/* Letter sounds. A ⟦x⟧ marker in a line is played from PHONEMES rather
   than spoken, so "B says ⟦b⟧, like ball!" is voice, clip, voice (⟦A⟧,
   capital, is the name of A; see letterName). A
   comma between two sounds is a breath, not something to say. */
let speakGen = 0, clip = null;
const CLIP_VOL = 0.92;
/* A tap cuts the sound off, but never dead: a hard stop mid-waveform is
   an audible click. Fade over 70 ms instead. Each play gets its own
   element, so a clip fading out never fights the one starting. */
function stopClip(){
  if(!clip) return;
  const {a, finish} = clip; clip = null; finish(true);
  const t0 = performance.now(), v0 = a.volume;
  (function step(){
    const k = 1 - (performance.now() - t0) / 70;
    if(k <= 0){ try{ a.pause(); }catch(e){} return; }
    a.volume = v0 * k; requestAnimationFrame(step);
  })();
}
function playClip(l){
  return new Promise(res => {
    const src = (typeof PHONEMES !== "undefined") && PHONEMES[l];
    if(!src) return res(false);
    const a = new Audio("data:audio/mpeg;base64," + src);
    a.volume = CLIP_VOL;
    let done = false;
    const finish = ok => { if(done) return; done = true; clearTimeout(guard);
                           a.onended = a.onerror = null; if(clip && clip.a === a) clip = null; res(ok); };
    const guard = setTimeout(() => finish(true), 2500);
    a.onended = () => finish(true); a.onerror = () => finish(false);
    clip = {a, finish};
    const p = a.play();
    if(p && p.catch) p.catch(() => finish(false));
  });
}
function rest(ms){ return new Promise(r => setTimeout(r, ms)); }
async function speakNow(text, opts){
  if(!text || text.indexOf("⟦") < 0) return speakLine(text, opts);
  const gen = speakGen;
  /* Room either side of a sound, so "B says ⟦b⟧, like ball" is not run
     together: the sound is the point of the sentence and needs to land. */
  const k = teacherMode() ? 1.25 : 1;
  const parts = text.split(/⟦([a-zA-Z])⟧/);
  for(let i = 0; i < parts.length; i++){
    if(gen !== speakGen) return;
    const p = parts[i];
    if(i % 2){
      if(!S.speech) continue;
      if(i > 1 && /[A-Za-z0-9]/.test(parts[i - 1])) await rest(150 * k);
      if(gen !== speakGen) return;
      if(!(await playClip(p))) await speakLine(BY[p] ? BY[p].tts : p + ",", opts);
    } else if(/[A-Za-z0-9]/.test(p)){
      if(i > 0) await rest(200 * k);
      if(gen !== speakGen) return;
      await speakLine(p.replace(/^[\s,.!?]+/, ""), opts);
    } else if(/[,.!?]/.test(p) && i > 0 && i < parts.length - 1){

}
function speakLine(text, opts){
  return new Promise(res => {
    if(!S.speech || !("speechSynthesis" in window) || !text) return res();
    opts = opts || {};
    if(!voice && !voiceReady) chooseVoice();
    const u = new SpeechSynthesisUtterance(text);
    if(voice) u.voice = voice;
    u.lang = (voice && voice.lang) || "en-US";
    /* A hair of jitter keeps the twentieth "Nice work!" from being bit
       for bit the same sound as the first, which is what makes a
       repeated phrase read as canned. */
    const jitter = 0.98 + Math.random() * 0.04;
    /* Parentese: slower and pitched up, the way a teacher speaks to a
       small child. On a good neural voice this reads as sing-song; it is
       only the old formant synths that turn it into a chipmunk. */
    const sRate  = teacherMode() ? 0.86 : 1;
    const sPitch = teacherMode() ? 1.22 : 1.0;
    u.rate  = (opts.rate  || S.rate) * sRate * jitter;
    u.pitch = (opts.pitch || sPitch) * jitter;
    u.volume = opts.volume || 0.92;            /* a warm voice does not shout */
    let done = false;
    const finish = () => { if(done) return; done = true; clearTimeout(guard); res(); };
    u.onend = finish; u.onerror = finish;
    /* Chrome can drop an utterance spoken right after cancel(): no start,
       no end, and the queue sat out the whole length guard in silence.
       So it gets 4 s to start (Piper needs ~1), then the line is skipped. */
    let guard = setTimeout(() => { speechSynthesis.cancel(); finish(); }, 4000);
    /* Once speaking, generous: if this fires early the next line talks
       over this one, which garbles both. It only ever catches a hang. */
    u.onstart = () => { clearTimeout(guard);
      guard = setTimeout(finish, 3000 + text.length * 170 / (u.rate || 1)); };

/* Everything queued remembers the generation it was queued in. A tap
   bumps the generation, so whatever was still waiting from before is
   skipped rather than playing over the new line. Resetting speakQueue

function enqueue(fn){
  const g = speakGen;

}
/* Move on when the voice has finished, not on a guessed timer. A fixed
   timer was either dead air (fast voice) or cut the teaching off when the
   next question's prompt interrupted it (slow voice). Waits out anything
   queued meanwhile, then a short beat; dropped if she has left the

let actGen = 0;
function afterSpeech(fn, ms){
  const g = actGen;

  (async () => {
    for(;;){
      const q = speakQueue;
      await q.catch(() => {});
      await rest(ms);
      if(g !== actGen) return;
      if(q === speakQueue) break;
    }

  })();
}
/* Stop everything now: the voice, a clip mid-sound, the Your-turn wait. */
function hush(){
  speakGen++; stopClip(); showTurn(false);
  if("speechSynthesis" in window) speechSynthesis.cancel();
  speakQueue = Promise.resolve();
}
/* say("...") queues; say("...", {now:true}) interrupts (a child taps fast). */
function say(text, opts){
  opts = opts || {};

  return enqueue(() => speakNow(text, opts));
}
function pause(ms){ return enqueue(() => new Promise(r => setTimeout(r, ms))); }
/* Queue a DOM change in speech order, so a highlight lands exactly with
   the sound it belongs to rather than racing it. */
function act(fn){ return enqueue(() => { try{ fn(); }catch(e){} }); }
/* A is the one letter whose name the voice cannot be trusted with: at
   the start of a phrase ("A says…", "A is for apple") it is read as the
   article "uh", and spelled "Ay" it is read as "aye", which sounds like
   "eye". So A's name is a clip too, ⟦A⟧ (capital = the name, small = the
   sound). The rest of the alphabet reads as its own letter name. */
function letterName(l){ return l.toUpperCase() === "A" ? "⟦A⟧" : l.toUpperCase(); }
function sayLetterName(l){ return say(letterName(l)); }

   fragment restarts flat with a gap, which is the robot sound. */
function sayFull(l, opts){
  opts = opts || {};

  if(!teacherMode()){
    const lead = opts.lead ? opts.lead + " " : "";
    say(lead + letterName(l) + " says " + d.sound + ", like " + d.word + "!", {now: !!opts.now});
    return;
  }
  beats([
    opts.lead || null,
    letterName(l) + "!",
    240,
    letterName(l) + " says " + d.sound + ".",
    200,
    d.sound + ", " + d.sound + ", " + d.sound + "!",
    240,
    d.word + "! " + letterName(l) + " is for " + d.word + "."
  ], !!opts.now);

    /* How the mouth makes it, said just as she tries it herself: seeing
       (here, hearing) the articulation is what helps a sound stick
       (Novelli, Ardoin & Rodgers 2024; Boyer & Ehri 2011). */
    beats(["Now you try! " + d.mouth, 200, "Can you say " + d.sound + "?"]);
    yourTurn(2600);
    beats([pick(HEARD)]);
  }
}
/* Warmth lives in the words more than in any setting. These are the
   things a patient grown-up says: togetherness, no hurry, never a
   telling-off for getting it wrong. */
const PRAISE = ["Oh, well done!","That's it! I knew you could do it.","Beautiful work!",
                "You're doing so well!","Yes! Look at you go.","I'm so proud of you!",
                "Lovely! That's exactly right.","Wonderful!","That's the one! Clever you.",
                "Yes! You're getting so good at this.","Perfect!","Hooray! You found it."];
const AGAIN  = ["That's okay. Let's try again.","Good try! Have another look.",
                "Nearly! I'll help you — try again.","It's alright. Take your time.",
                "Ooh, so close. Let's find it together.","Nice try! Let's have one more go.",
                "Not that one, but keep going. You can do it."];
function kidName(){ return (S.kidName || "").trim(); }
function praise(){
  const nm = kidName(), base = pick(PRAISE);
  return (nm && Math.random() < 0.5) ? base.replace(/[!.]\s*$/, "") + ", " + nm + "!" : base;
}
function again(){
  const nm = kidName(), base = pick(AGAIN);
  return (nm && Math.random() < 0.4) ? base.replace(/[!.]\s*$/, "") + ", " + nm + "." : base;
}
const pick = a => a[Math.floor(Math.random() * a.length)];
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function sample(arr, n, exclude){
  const pool = shuffle(arr.filter(x => !exclude || !exclude.includes(x)));
  return pool.slice(0, n);
}

/* =====================================================================
   CELEBRATION
   ===================================================================== */
const conf = document.getElementById("confetti");
const cx = conf.getContext("2d");
let confBits = [], confRAF = null;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(){
  if(reduceMotion) return;
  conf.classList.remove("hidden");
  conf.width = innerWidth; conf.height = innerHeight;
  const cols = ["#E4572E","#F4B942","#3E92CC","#8A5FBF","#58A55C","#F6C445"];
  for(let i=0;i<90;i++) confBits.push({
    x: innerWidth/2 + (Math.random()-0.5)*260, y: innerHeight*0.42,
    vx:(Math.random()-0.5)*13, vy:-6-Math.random()*11,
    s:7+Math.random()*9, c:cols[i%cols.length], r:Math.random()*6, vr:(Math.random()-0.5)*0.4
  });
  if(!confRAF) confRAF = requestAnimationFrame(stepConf);
}
function stepConf(){
  cx.clearRect(0,0,conf.width,conf.height);
  confBits = confBits.filter(p => p.y < conf.height + 40);
  confBits.forEach(p => {
    p.vy += 0.42; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r);
    cx.fillStyle = p.c; cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.62); cx.restore();
  });
  if(confBits.length) confRAF = requestAnimationFrame(stepConf);
  else { confRAF = null; conf.classList.add("hidden"); cx.clearRect(0,0,conf.width,conf.height); }
}
function cheer(title, sub, ms){

}

<script>
/* =====================================================================
   DRAG ENGINE
   Pointer Events, so one code path covers trackpad, mouse and the
   touchscreen. Every drag target also accepts tap-the-tile then
   tap-the-target, so a child who cannot hold a drag yet is never
   locked out of the phonics underneath.
   ===================================================================== */
function dragSystem(opts){

  const THRESHOLD = 7;

  function targetUnder(x, y){

  function clearHover(){ document.querySelectorAll(".bin.over,.slot.over").forEach(e => e.classList.remove("over")); }
  function unpick(){
    if(picked) picked.classList.remove("picked");
    picked = null;
  }
  function endDrag(x, y){
    if(ghost){ ghost.remove(); ghost = null; }
    if(origin) origin.classList.remove("ghost");
    clearHover();
    const t = targetUnder(x, y);
    if(t && origin) opts.onDrop(origin, t);
    origin = null; dragging = false;
  }
  function onTileDown(e){
    if(e.button !== undefined && e.button !== 0) return;
    const tile = e.currentTarget;
    startX = e.clientX; startY = e.clientY; origin = tile; dragging = false;
    try{ tile.setPointerCapture(e.pointerId); }catch(err){}
  }
  function onTileMove(e){
    if(!origin) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(!dragging && Math.hypot(dx, dy) > THRESHOLD){
      dragging = true;
      unpick();
      ghost = origin.cloneNode(true);
      ghost.className = origin.className + " dragging";
      document.body.appendChild(ghost);
      origin.classList.add("ghost");
      if(opts.onLift) opts.onLift(origin);
    }
    if(dragging && ghost){
      ghost.style.left = e.clientX + "px";
      ghost.style.top  = e.clientY + "px";
      clearHover();
      const t = targetUnder(e.clientX, e.clientY);
      if(t) t.classList.add("over");
    }
  }
  function onTileUp(e){
    if(!origin) return;
    try{ origin.releasePointerCapture(e.pointerId); }catch(err){}
    if(dragging){ endDrag(e.clientX, e.clientY); return; }
    /* a tap, not a drag: pick it up, or put a picked tile down */
    const tile = origin; origin = null;
    if(picked === tile){ unpick(); return; }
    unpick();
    picked = tile; tile.classList.add("picked");
    if(opts.onPick) opts.onPick(tile);
  }
  function onTargetTap(e){
    if(!picked) return;
    const t = e.currentTarget, tile = picked;
    unpick();
    opts.onDrop(tile, t);
  }
  return {
    tile(el){
      el.addEventListener("pointerdown", onTileDown);
      el.addEventListener("pointermove", onTileMove);
      el.addEventListener("pointerup", onTileUp);
      el.addEventListener("pointercancel", () => { if(ghost){ghost.remove();ghost=null;} if(origin) origin.classList.remove("ghost"); origin=null; dragging=false; clearHover(); });
      el.addEventListener("dragstart", ev => ev.preventDefault());
      return el;
    },
    target(el){ el.setAttribute("data-drop",""); el.addEventListener("click", onTargetTap); return el; },
    reset(){ unpick(); if(ghost){ghost.remove();ghost=null;} origin=null; dragging=false; clearHover(); }
  };
}
function makeTile(letter, cls, small){
  const b = document.createElement("button");
  b.className = "tile " + (small ? "sm " : "") + (cls || "");
  b.textContent = show(letter);
  b.dataset.letter = letter;
  b.setAttribute("aria-label", "letter " + letter.toUpperCase());
  return b;
}
function flashRight(el){ el.classList.add("right"); setTimeout(() => el.classList.remove("right"), 480); }
function flashWrong(el){ el.classList.add("wrong"); sfxOops(); pipFace("oops", 900);
  setTimeout(() => el.classList.remove("wrong"), 420); }
function record(id, n){ if((S.best[id]||0) < n){ S.best[id] = n; save(); } }

ACTIVITIES.build = {

  start(){
    let round = 0, got = 0;

    let word = null;

      got++; round++; addStar(2);

<script>
/* =====================================================================
   6. BUBBLE POP — move the pointer, then click. The first trackpad
   skill: getting the pointer where you want it and keeping it there.
   ===================================================================== */
ACTIVITIES.bubbles = {
  name:"Bubble Pop", group:"trackpad", color:"c-sky", emoji:"🫧", skill:"point + click",
  what:"Move the pointer onto the right letter, then click to pop it.",
  start(){
    let got = 0, target = pick(ALPHA), raf = null;
    const box = document.createElement("div"); box.className = "bubblebox";
    const cv = document.createElement("canvas"); cv.id = "bubbleCanvas";
    box.appendChild(cv); playArea.appendChild(box);
    const g = cv.getContext("2d");
    const COLORS = ["#E4572E","#F4B942","#3E92CC","#8A5FBF","#58A55C"];
    let bubbles = [], mx = -999, my = -999;

    function size(){
      const r = box.getBoundingClientRect();
      cv.width = Math.max(320, r.width); cv.height = Math.max(300, r.height);
    }
    function spawn(letter){
      const r = 46 + Math.random() * 12;
      return {
        x: r + Math.random() * (cv.width - r*2),
        y: r + Math.random() * (cv.height - r*2),
        vx: reduceMotion ? 0 : (Math.random()-0.5) * 0.75,
        vy: reduceMotion ? 0 : (Math.random()-0.5) * 0.75,
        r, l: letter, disp: show(letter), c: COLORS[Math.floor(Math.random()*COLORS.length)], pop: 0
      };
    }
    function fill(){
      bubbles = [];
      const others = sample(ALPHA, 5, [target]);
      [target].concat(others).forEach(l => bubbles.push(spawn(l)));
      bubbles = shuffle(bubbles);
    }
    function ask(){
      target = pick(ALPHA);
      fill();
      const shown = (bubbles.find(b => b.l === target) || {}).disp || show(target);
      setPrompt('Pop the letter <b>' + shown + '</b>', "Pop the letter " + target.toUpperCase());
    }
    function draw(){
      g.clearRect(0,0,cv.width,cv.height);
      bubbles.forEach(b => {
        b.x += b.vx; b.y += b.vy;
        if(b.x < b.r || b.x > cv.width - b.r) b.vx *= -1;
        if(b.y < b.r || b.y > cv.height - b.r) b.vy *= -1;
        const hover = Math.hypot(mx - b.x, my - b.y) < b.r;
        g.save(); g.translate(b.x, b.y);
        if(hover) g.scale(1.1, 1.1);
        g.beginPath(); g.arc(0,0,b.r,0,Math.PI*2);
        g.fillStyle = b.c; g.fill();
        g.lineWidth = hover ? 9 : 5; g.strokeStyle = hover ? "#F6C445" : "#2A2622"; g.stroke();
        g.beginPath(); g.arc(-b.r*0.32,-b.r*0.34,b.r*0.19,0,Math.PI*2);
        g.fillStyle = "rgba(255,255,255,.55)"; g.fill();
        g.fillStyle = "#fff"; g.font = '700 ' + Math.round(b.r*1.08) + 'px Andika, sans-serif';
        g.textAlign = "center"; g.textBaseline = "middle";
        g.fillText(b.disp, 0, 2);
        g.restore();
      });
      raf = requestAnimationFrame(draw);
    }
    cv.addEventListener("pointermove", e => {
      const r = cv.getBoundingClientRect();
      mx = e.clientX - r.left; my = e.clientY - r.top;
    });
    cv.addEventListener("pointerleave", () => { mx = my = -999; });
    cv.addEventListener("click", e => {
      const r = cv.getBoundingClientRect();
      const x = e.clientX - r.left, y = e.clientY - r.top;
      const hit = bubbles.slice().reverse().find(b => Math.hypot(x - b.x, y - b.y) < b.r);
      if(!hit) return;
      if(hit.l === target){
        sfxPop();
        bubbles = bubbles.filter(b => b !== hit);
        got++; addStar(); markSeen(target); record("bubbles", Math.min(5, got));
        setDots(Math.min(got,5), 5);
        sayFull(target, {now:true, lead: praise()});
        if(got >= 5){
          cheer("Pop pop pop!", "5 bubbles popped.", 2600);
          afterSpeech(goHome);
        } else afterSpeech(ask);
      } else {
        say("That one is " + letterName(hit.l) + ". Let's look for " + letterName(target) + " together.", {now:true});
      }
    });
    const onResize = () => { size(); fill(); };
    addEventListener("resize", onResize);
    onCleanup(() => { cancelAnimationFrame(raf); removeEventListener("resize", onResize); });
    size(); setDots(0,5); ask(); draw();
  }
};

/* =====================================================================
   7. BIG AND LITTLE — drag. Always shows mixed case: sorting a letter
   by case is the kindergarten skill, the drag is the trackpad one.
   ===================================================================== */
ACTIVITIES.bins = {
  name:"Big and Little", group:"trackpad", color:"c-poppy", emoji:"🧺", skill:"drag",
  what:"Drag each letter into the BIG basket or the little basket.",
  start(){
    let round = 0, left = 0;
    const wrap = document.createElement("div"); wrap.className = "tilewrap";

    const hint = document.createElement("div"); hint.className = "hint";
    hint.textContent = "Press and hold, then move — or tap a letter, then tap a basket.";
    playArea.append(wrap, bins, hint);

    const drag = dragSystem({
      onDrop(tile, bin){
        const isUpper = tile.textContent === tile.textContent.toUpperCase();
        const wantUpper = bin.dataset.kind === "upper";
        if(isUpper === wantUpper){
          const l = tile.dataset.letter;
          markSeen(l); addStar();
          tile.remove();
          const mini = document.createElement("span");
          mini.className = "tile sm " + pick(TILECOLORS);
          mini.style.cssText = "width:44px;height:44px;font-size:26px;box-shadow:0 3px 0 var(--ink)";
          mini.textContent = isUpper ? l.toUpperCase() : l;
          bin.querySelector(".caught").appendChild(mini);
          say(letterName(l) + ", that's a " + (isUpper ? "big one!" : "little one!"), {now:true});
          left--;
          if(left === 0){ round++; record("bins", Math.round(round*5/4)); setDots(round,4); confetti(); afterSpeech(next); }
        } else {
          flashWrong(tile);
          say(isUpper ? "That one is a big letter. Try the other basket." : "That one is a little letter. Try the other basket.", {now:true});
        }
      },
      onPick(tile){ say(letterName(tile.dataset.letter), {now:true}); }
    });
    onCleanup(() => drag.reset());

    function next(){
      if(round >= 4){
        cheer("All sorted!", "Big letters and little letters.", 2600);
        afterSpeech(goHome); return;
      }
      setDots(round,4);
      drag.reset();
      wrap.innerHTML = ""; bins.innerHTML = "";
      setPrompt('Put each letter in the right basket.', "Drag each letter into the right basket. Big letters on the left, little letters on the right.");
      [["upper","BIG letters","Aa".slice(0,1)],["lower","little letters","a"]].forEach(([kind, label]) => {
        const b = document.createElement("div");
        b.className = "bin"; b.dataset.kind = kind;
        b.innerHTML = '<h4>' + label + '</h4><div class="caught"></div>';
        drag.target(b);
        bins.appendChild(b);
      });
      const letters = sample(ALPHA, 4);
      left = 4;
      letters.forEach((l, i) => {
        const t = document.createElement("button");
        t.className = "tile " + TILECOLORS[i % TILECOLORS.length];
        t.textContent = Math.random() < 0.5 ? l.toUpperCase() : l;
        t.dataset.letter = l;
        drag.tile(t);
        wrap.appendChild(t);
      });
    }
    setDots(0,4); next();
  }
};
