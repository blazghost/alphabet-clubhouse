    let round = 0, got = 0;
    const box = document.createElement("div"); box.className = "scrollbox";
    const hint = document.createElement("div"); hint.className = "hint";
    hint.textContent = "Put two fingers on the trackpad and slide them up or down.";
    playArea.append(box, hint);
    function next(){
      let locked = false;
      if(round >= 4){
        cheer("You found them all!", "Scrolling like a pro.", 2600);
        afterSpeech(goHome); return;
      }
      setDots(got, 4);
      const list = shuffle(ALPHA);
      const target = list[18 + Math.floor(Math.random() * 7)]; /* always well below the fold */
      box.innerHTML = "";
      box.scrollTop = 0;
      const tiles = list.map((l, i) => makeTile(l, TILECOLORS[i % TILECOLORS.length]));
      setPrompt('Scroll down to find <b>' + tiles[list.indexOf(target)].textContent + '</b>', "Scroll down with two fingers to find " + target.toUpperCase());
      list.forEach((l, i) => {
        const t = tiles[i];
        t.style.cssText = "width:100%;height:72px;font-size:40px;flex:none";
        t.addEventListener("click", () => {
          if(l === target){
            if(locked) return; locked = true;
            flashRight(t); addStar(); markSeen(l); got++; round++;
            record("scroll", Math.round(got*5/4));
            say(praise(), {now:true}); sayLetterName(l);
            setDots(got, 4);
            afterSpeech(next);
          } else {
            flashWrong(t);
            say("That one is " + letterName(l) + ". Keep scrolling, you'll find " + letterName(target) + ".", {now:true});
          }
        });
        box.appendChild(t);
      });
    }
    setDots(0,4); next();
  }
};

/* =====================================================================
  10. TRACE A LETTER — press, hold and follow. The hardest trackpad
   move and correct letter formation in one: strokes start where a
   pencil starts, and run in the order she is taught to write them.
   ===================================================================== */
const TRACE = {
  l:["M62,42 L62,214 L152,214"],
  t:["M40,48 L160,48","M100,48 L100,214"],
  i:["M100,48 L100,214"],
  o:["M100,44 C62,44 46,84 46,131 C46,178 62,218 100,218 C138,218 154,178 154,131 C154,84 138,44 100,44"],
  c:["M152,74 C138,52 120,44 100,44 C62,44 46,84 46,131 C46,178 62,218 100,218 C120,218 138,210 152,188"],
  v:["M52,46 L100,214 L148,46"],
  u:["M52,46 L52,152 C52,192 72,218 100,218 C128,218 148,192 148,152 L148,46"],
  z:["M52,50 L148,50 L52,210 L148,210"],
  x:["M52,46 L148,214","M148,46 L52,214"],
  h:["M52,46 L52,214","M148,46 L148,214","M52,130 L148,130"],
  a:["M100,44 L54,214","M100,44 L146,214","M72,158 L128,158"]
};
const TRACE_ORDER = ["l","i","t","o","c","v","u","x","z","h","a"];

ACTIVITIES.trace = {
  name:"Trace a Letter", group:"trackpad", color:"c-sun", emoji:"✏️", skill:"press + drag",
  what:"Hold down and slide along the line to write the letter.",
  start(){
    let idx = 0;
    const queue = shuffle(TRACE_ORDER.slice(0, 7)).slice(0, 4);
    const box = document.createElement("div"); box.className = "tracebox";
    const hint = document.createElement("div"); hint.className = "hint";
    hint.textContent = "Start on the green dot. Hold the click down the whole way.";
    const skip = document.createElement("button"); skip.className = "pill"; skip.textContent = "Next letter →";
    box.innerHTML = '<svg class="tracesvg" id="tsvg" viewBox="0 0 200 260" width="290" height="377" aria-hidden="true"></svg>';
    playArea.append(box, hint, skip);
    const svg = box.querySelector("#tsvg");
    const NS = "http://www.w3.org/2000/svg";
    let strokes = [], si = 0, letter = null, drawing = false, cps = [], ci = 0, inkPath = null, len = 0;

    function el(tag, attrs){ const e = document.createElementNS(NS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); return e; }
    function buildStroke(){
      const d = strokes[si];
      /* guide corridor + dotted centre line + the ink that follows her */
      svg.appendChild(el("path", {d, class:"guide"}));
      svg.appendChild(el("path", {d, class:"dash"}));
      inkPath = el("path", {d, class:"ink"});
      svg.appendChild(inkPath);
      len = inkPath.getTotalLength();
      inkPath.style.strokeDasharray = len;
      inkPath.style.strokeDashoffset = len;
      cps = [];
      const step = Math.max(9, len / 26);
      for(let t = 0; t <= len; t += step) cps.push(inkPath.getPointAtLength(t));
      cps.push(inkPath.getPointAtLength(len));
      ci = 0;
      const s = cps[0], e2 = cps[cps.length-1];
      svg.appendChild(el("circle", {cx:s.x, cy:s.y, r:15, class:"startdot"}));
      svg.appendChild(el("circle", {cx:e2.x, cy:e2.y, r:10, class:"endflag"}));
    }
    function loadLetter(){
      if(idx >= queue.length){
        cheer("You wrote them!", "4 letters traced.", 2800);
        afterSpeech(goHome); return;
      }
      setDots(idx, 4);
      letter = queue[idx];
      strokes = TRACE[letter]; si = 0;
      svg.innerHTML = "";
      setPrompt('Trace the letter <b>' + letter.toUpperCase() + '</b>', "Trace the letter " + letter.toUpperCase() + ". Start on the green dot and hold it down.");
      buildStroke();
    }
    function toSvg(e){
      const r = svg.getBoundingClientRect();
      return {x:(e.clientX - r.left) / r.width * 200, y:(e.clientY - r.top) / r.height * 260};
    }
    const TOL = 40;
    svg.addEventListener("pointerdown", e => {
      const p = toSvg(e);
      if(Math.hypot(p.x - cps[ci].x, p.y - cps[ci].y) < TOL){
        drawing = true;
        try{ svg.setPointerCapture(e.pointerId); }catch(err){}
      } else {
        say("Let's start on the green dot.", {now:true}); pipFace("oops", 800); sfxOops();
      }
    });
    svg.addEventListener("pointermove", e => {
      if(!drawing) return;
      const p = toSvg(e);
      let moved = false;
      while(ci < cps.length - 1 && Math.hypot(p.x - cps[ci+1].x, p.y - cps[ci+1].y) < TOL){ ci++; moved = true; }
      if(moved){
        inkPath.style.strokeDashoffset = len - (ci / (cps.length - 1)) * len;
        if(ci >= cps.length - 1) finishStroke();
      }
    });
    svg.addEventListener("pointerup", () => {
      if(drawing && ci < cps.length - 1) say("That's okay! Hold the click down and carry on from where you stopped.", {now:true});
      drawing = false;
    });
    svg.addEventListener("pointercancel", () => { drawing = false; });
    function finishStroke(){
      drawing = false;
      inkPath.setAttribute("class", "done-stroke");
      si++;
      if(si < strokes.length){
        say(pick(["Lovely! Now the next line.","That's it! One more line.","Well done. Now the next line."]), {now:true});
        buildStroke();
      } else {
        addStar(2); markSeen(letter);
        idx++;
        record("trace", Math.round(idx*5/4));
        setDots(idx, 4);
        confetti();
        sayFull(letter, {now:true, lead: praise()});
        afterSpeech(loadLetter);
      }
    }
    skip.addEventListener("click", () => { idx++; loadLetter(); });
    setDots(0,4); loadLetter();
  }
};
</script>

<script>
/* =====================================================================
   SHEETS — settings and the grown-ups panel
   ===================================================================== */
/* =====================================================================
   PIP — the owl who does the talking. Giving the voice a face is what
   makes it read as someone caring rather than a machine reading out
   words, so he reacts to every answer and he is the replay button.
   ===================================================================== */
const PIP_SVG = '<svg class="pip" viewBox="0 0 100 100" aria-hidden="true">' +
  '<path d="M28 26 L22 8 L41 18 Z" fill="#D9932E" stroke="#2A2622" stroke-width="3" stroke-linejoin="round"/>' +
  '<path d="M72 26 L78 8 L59 18 Z" fill="#D9932E" stroke="#2A2622" stroke-width="3" stroke-linejoin="round"/>' +
  '<ellipse cx="50" cy="56" rx="36" ry="38" fill="#F4B942" stroke="#2A2622" stroke-width="4"/>' +
  '<ellipse cx="50" cy="69" rx="23" ry="23" fill="#FFF0CC" stroke="#2A2622" stroke-width="3"/>' +
  '<ellipse class="wing l" cx="16" cy="56" rx="9" ry="20" fill="#E09A2B" stroke="#2A2622" stroke-width="3.5"/>' +
  '<ellipse class="wing r" cx="84" cy="56" rx="9" ry="20" fill="#E09A2B" stroke="#2A2622" stroke-width="3.5"/>' +
  '<g class="eye l"><circle cx="37" cy="45" r="14" fill="#fff" stroke="#2A2622" stroke-width="3.5"/>' +
    '<circle class="pupil" cx="37" cy="45" r="6.5" fill="#2A2622"/><circle cx="39.6" cy="42.4" r="2.3" fill="#fff"/></g>' +
  '<g class="eye r"><circle cx="63" cy="45" r="14" fill="#fff" stroke="#2A2622" stroke-width="3.5"/>' +
    '<circle class="pupil" cx="63" cy="45" r="6.5" fill="#2A2622"/><circle cx="65.6" cy="42.4" r="2.3" fill="#fff"/></g>' +
  '<path class="brow" d="M25 29 L46 34" stroke="#2A2622" stroke-width="4" stroke-linecap="round" fill="none"/>' +
  '<path class="brow" d="M75 29 L54 34" stroke="#2A2622" stroke-width="4" stroke-linecap="round" fill="none"/>' +
  '<path d="M50 54 L43 62 L57 62 Z" fill="#E4572E" stroke="#2A2622" stroke-width="3" stroke-linejoin="round"/>' +
  '<path d="M38 91 l0 6 M33 97 h10 M62 91 l0 6 M57 97 h10" stroke="#E4572E" stroke-width="4" stroke-linecap="round" fill="none"/>' +
  '</svg>';
let pipTimer = null;
function pipFace(state, ms){
  const ws = document.querySelectorAll(".pipwrap");
  ws.forEach(w => w.classList.remove("happy","oops","party","listening"));
  if(!state) return;
  ws.forEach(w => w.classList.add(state));
  clearTimeout(pipTimer);
  pipTimer = setTimeout(() => document.querySelectorAll(".pipwrap")
    .forEach(w => w.classList.remove("happy","oops","party","listening")), ms || 900);
}

/* =====================================================================
   SOUND — soft sine tones, never a harsh beep. She may be on headphones.
   ===================================================================== */
let AC = null;
function ac(){
  if(!AC){ try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
  if(AC.state === "suspended") AC.resume();
  return AC;
}
function tone(freq, start, dur, type, peak){
  if(!S.sfx) return;
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || "sine"; o.frequency.value = freq;
  const t = c.currentTime + start;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak || 0.10, t + 0.025);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const sfxGood    = () => [523.25,659.25,783.99].forEach((f,i) => tone(f, i*0.085, 0.34, "sine", 0.09));
const sfxOops    = () => { tone(392, 0, 0.20, "sine", 0.055); tone(329.63, 0.11, 0.30, "sine", 0.05); };
const sfxPop     = () => tone(880, 0, 0.12, "triangle", 0.07);
const sfxSticker = () => [659.25,783.99,1046.5,1318.5].forEach((f,i) => tone(f, i*0.075, 0.5, "triangle", 0.08));
const sfxWin     = () => [523.25,659.25,783.99,1046.5].forEach((f,i) => tone(f, i*0.12, 0.55, "sine", 0.10));

/* =====================================================================
   TEACHER DELIVERY
   Modelled on how the toddler-teaching videos talk: slow, sing-song,
   the key sound said three times, and then — the part that actually
   does the work — a real pause that waits for her to say it back.
   A silent gap only reads as an invitation if something on screen says
   so, hence the "your turn" badge.
   ===================================================================== */
function teacherMode(){ return S.style !== "simple"; }
/* A beat list: a string is spoken, a number is a pause. Only the first
   beat is allowed to cut off whatever was already being said. */
function beats(list, interrupt){
  let first = true;
  list.forEach(b => {
    if(b === null || b === undefined || b === "") return;
    if(typeof b === "number"){ pause(b); return; }
    if(typeof b === "object"){
      say(b.t, Object.assign({}, b, {now: interrupt && first}));
    } else {
      say(b, {now: interrupt && first});
    }
    first = false;
  });
}
/* Speak only in teacher mode (repetitions, asides). */
function echo(t, opts){ if(teacherMode()) say(t, opts); }
function waitBeat(ms){ if(teacherMode()) pause(ms); }

let turnEl = null;
function showTurn(on, ms){
  if(turnEl){ turnEl.remove(); turnEl = null; }
  if(!on) return;
  turnEl = document.createElement("div");
  turnEl.className = "turnbadge";
  turnEl.innerHTML = '<span aria-hidden="true">🗣️</span><span>Your turn!</span>' +
                     '<span class="turnbar"><i style="animation-duration:' + (ms/1000) + 's"></i></span>';
  document.body.appendChild(turnEl);
}
/* Hand the floor to her and genuinely wait. */
function yourTurn(ms){
  if(!teacherMode()) return;
  ms = ms || 2600;
  enqueue(() => new Promise(res => {
    const g = speakGen;
    showTurn(true, ms);
    pipFace("listening", ms + 300);
    setTimeout(() => { if(g === speakGen) showTurn(false); res(); }, ms);
  }));
}
const HEARD = ["Good job saying it!","I heard you! Well done.","Yay! You said it.",
               "Nice speaking!","That was lovely saying.","You said it so well!"];
function sfxClap(n){
  if(!S.sfx) return;
  const c = ac(); if(!c) return;
  for(let i = 0; i < (n || 6); i++){
    const dur = 0.085, t = c.currentTime + i * 0.125 + Math.random() * 0.02;
    const buf = c.createBuffer(1, Math.ceil(c.sampleRate * dur), c.sampleRate);
    const d = buf.getChannelData(0);
    for(let j = 0; j < d.length; j++) d[j] = (Math.random() * 2 - 1) * Math.pow(1 - j / d.length, 3);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1500; f.Q.value = 0.7;
    const g = c.createGain(); g.gain.value = 0.14;
    src.connect(f); f.connect(g); g.connect(c.destination); src.start(t);
  }
}

/* =====================================================================
   THE READING PATH
   Letters are introduced in phonics order, not alphabetical order:
   s a t p i n first, because those six make more real words than any
   other six in English (sat, pit, tap, nip, pan...). Going A, B, C
   means a child cannot read a single word until she is most of the way
   through the alphabet. Each step is a short guided lesson that ends
   with her reading a real sentence made only of sounds she has met.
   ===================================================================== */
const PATH = [
  {letters:["s","a","t","p","i","n"],
   words:[["pin","📌"],["pan","🍳"],["tin","🥫"],["tap","🚰"],["nap","😴"],["pit","🕳️"]],
   read:["Pat sat.","A tin pan.","Nip it!","Tip a pin."]},
  {letters:["c","k","e","h","r","m","d"],
   words:[["cat","🐱"],["hat","🎩"],["hen","🐔"],["rat","🐀"],["cap","🧢"],["map","🗺️"]],
   read:["A red hen.","Dad had a map.","A cat ran.","Sam met a rat."]},
  {letters:["g","o","u","l","f","b"],
   words:[["dog","🐶"],["log","🪵"],["bug","🐛"],["bus","🚌"],["bag","🎒"],["bed","🛏️"]],
   read:["A big dog.","A bug is fun.","Bob got mud.","A log in fog."]},
  {letters:["j","z","w","v","y","x","q"],
   words:[["jam","🍓"],["van","🚐"],["box","📦"],["fox","🦊"],["jet","✈️"],["web","🕸️"]],
   read:["A fox in a box.","Jim has a jet.","Zip it up!","A wet web."]}
];
const STEP_NAMES = ["Step 1","Step 2","Step 3","Step 4"];
function stepUnlocked(i){ return i === 0 || !!(S.lessons && S.lessons[i-1]); }
function renderPath(){
  const el = document.getElementById("path"); if(!el) return;
  el.innerHTML = "";
  PATH.forEach((st, i) => {
    const done = !!(S.lessons && S.lessons[i]);
    const open = stepUnlocked(i);
    const b = document.createElement("button");
    b.className = "step" + (open ? "" : " locked");
    b.innerHTML =
      '<span class="stone ' + (done ? "done" : (open ? "on" : "locked")) + '">' +
        (done ? "★" : (open ? (i+1) : "🔒")) + '</span>' +
        '<span class="lets">' + st.letters.map(show).join(" ") + '</span>' +
        '<span class="cap">' + (done ? "Done" : (open ? STEP_NAMES[i] : "Locked")) + '</span>';
    b.addEventListener("click", () => {
      if(!open){
        pipFace("oops", 900);
        say("Let's finish step " + i + " first!", {now:true});
        return;
      }
      startLesson(i);
    });
    b.addEventListener("pointerenter", () => say(STEP_NAMES[i], {now:true}));
    el.appendChild(b);
  });
}

/* ---- continuous blending: hold each sound, then swoop them together ---- */
function swoopSvg(count, tileW, gapW){
  const w = count*tileW + (count-1)*gapW, pad = 10, y0 = 6, dip = 30;
  let d = "M " + pad + " " + y0;
  for(let i = 0; i < count - 1; i++){
    const x1 = pad + (i + 0.5)*(tileW + gapW) + tileW/2;
    const x2 = pad + (i + 1)*(tileW + gapW);
    d += " Q " + x1 + " " + (y0 + dip) + " " + x2 + " " + y0;
  }
  return '<svg class="swoop" viewBox="0 0 ' + (w + pad*2) + ' 42" width="' + (w + pad*2) + '" height="42">' +
         '<path d="' + d + '"/></svg>';
}
function runSwoop(svg, ms){
  const path = svg && svg.querySelector("path"); if(!path) return;
  let len = 0; try{ len = path.getTotalLength(); }catch(e){ return; }
  path.style.setProperty("--len", len);
  path.style.setProperty("--dur", (ms || 1100) / 1000 + "s");
  path.classList.remove("go");
  void path.getBoundingClientRect();
  path.classList.add("go");
}
/* Light each letter as its sound is held, then say the whole word. */
function blendWord(word, row, swoop, done){
  const tiles = Array.from(row.querySelectorAll(".tile, .slot"));
  act(() => tiles.forEach(t => t.classList.remove("lit","all")));
  word.split("").forEach((l, i) => {
    act(() => { tiles.forEach(t => t.classList.remove("lit")); if(tiles[i]) tiles[i].classList.add("lit"); });
    say((BY[l] ? BY[l].sound : l), {rate: 0.55});
    pause(200);
  });
  act(() => {
    tiles.forEach(t => { t.classList.remove("lit"); t.classList.add("all"); });
    if(swoop) runSwoop(swoop, 900);
  });
  pause(220);
  say(word + "!", {rate: 0.8});
  if(done) act(done);
}

/* ---- the guided lesson: meet the sounds, find them, build a word,
        then read a real sentence made only of what she has met ---- */
let currentStep = 0;
function startLesson(i){ currentStep = i; openActivity("lesson"); }
ACTIVITIES.lesson = {
  name:"Reading Lesson", group:"path", color:"c-sun", emoji:"📖", skill:"lesson", what:"", hidden:true,
  start(){
    const st = PATH[currentStep];
    document.getElementById("pageTitle").textContent = STEP_NAMES[currentStep];
    const box = document.createElement("div");
    box.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:16px;width:100%";
    playArea.appendChild(box);

    function setPhase(k){
      dotsEl.className = "phase"; dotsEl.innerHTML = "";
      for(let i = 0; i < 4; i++){
        const e = document.createElement("i"); if(i < k) e.className = "on"; dotsEl.appendChild(e);
      }
    }
    function run(i){
      setPhase(i);
      box.innerHTML = "";
      if(i >= 4){ finish(); return; }
      [meet, find, buildPhase, readPhase][i]();
    }
    function coachLine(text){
      const c = document.createElement("div");
      c.className = "coach";
      c.innerHTML = "<b>Grown-ups:</b> " + text;
      return c;
    }

    /* 1 — meet the sounds */
    function meet(){
      const ls = sample(st.letters, Math.min(3, st.letters.length));
      let k = 0;
      const pic = document.createElement("div"); pic.className = "pic";
      const one = document.createElement("div"); one.className = "tilewrap";
      box.append(coachLine("sit with her. When the <b>Your turn!</b> badge shows, say the sound out loud together."), pic, one);
      function nextLetter(){
        if(k >= ls.length){ run(1); return; }
        const l = ls[k++];
        one.innerHTML = "";
        one.appendChild(makeTile(l, pick(TILECOLORS)));
        pic.textContent = BY[l].emoji;
        setPrompt('This one says <b>' + show(l) + '</b>', "");
        sayFull(l, {now:true, invite:true});
        markSeen(l);
        act(nextLetter);
      }
      nextLetter();
    }

    /* 2 — find it among others */
    function find(){
      let r = 0;
      const wrap = document.createElement("div"); wrap.className = "tilewrap";
      box.append(coachLine("let her point at the screen before she clicks. Naming it out loud helps."), wrap);
      function round(){
        let locked = false;
        if(r >= 3){ run(2); return; }
        const target = pick(st.letters);
        const opts = shuffle(sample(st.letters.concat(ALPHA), 2, [target]).concat([target]));
        wrap.innerHTML = "";
        const tiles = opts.map((l, i) => makeTile(l, TILECOLORS[i % TILECOLORS.length]));
        setPrompt('Find <b>' + tiles[opts.indexOf(target)].textContent + '</b>',
                  "Can you find " + letterName(target) + "?");
        waitBeat(300); echo(letterName(target) + "!");
        opts.forEach((l, i) => {
          const t = tiles[i];
          t.addEventListener("click", () => {
            if(l === target){
              if(locked) return; locked = true;
              flashRight(t); addStar(); markSeen(l); r++;
              sayFull(l, {now:true, lead: praise()});
              afterSpeech(round);
            } else {
              flashWrong(t); say(again(), {now:true});
            }
          });
          wrap.appendChild(t);
        });
      }
      round();
    }

    /* 3 — build it, then blend it */
    function buildPhase(){
      let r = 0, word = null;
      const pic = document.createElement("div"); pic.className = "pic";
      const slots = document.createElement("div"); slots.className = "slots";
      const sw = document.createElement("div");
      const wrap = document.createElement("div"); wrap.className = "tilewrap";
      box.append(coachLine("as each letter lands she hears its sound. When the word is done, listen to it blend."),
                 pic, slots, sw, wrap);
      const drag = dragSystem({
        onDrop(tile, slot){
          if(slot.classList.contains("filled")) return;
          if(tile.dataset.letter === slot.dataset.want){
            slot.textContent = tile.textContent;
            slot.classList.add("filled");
            tile.remove();
            say(BY[slot.dataset.want].sound, {now:true, rate: 0.6});
            check();
          } else {
            flashWrong(tile);
            say("That one says " + BY[tile.dataset.letter].sound + ". Let's try a different one.", {now:true});
          }
        },
        onPick(tile){ say(BY[tile.dataset.letter].sound, {now:true, rate: 0.6}); }
      });
      onCleanup(() => drag.reset());
      function check(){
        if(slots.querySelectorAll(".filled").length !== word[0].length) return;
        addStar(2); word[0].split("").forEach(markSeen);
        const tw = slots.querySelector(".slot").getBoundingClientRect().width || 104;
        sw.innerHTML = swoopSvg(word[0].length, tw, 12);
        say("Now let's blend it!", {now:true});
        blendWord(word[0], slots, sw.querySelector("svg"), () => {
          r++;
          afterSpeech(nextWord);
        });
      }
      function nextWord(){
        if(r >= 2){ run(3); return; }
        drag.reset();
        word = pick(st.words);
        pic.textContent = word[1];
        slots.innerHTML = ""; wrap.innerHTML = ""; sw.innerHTML = "";
        setPrompt('Build <b>' + word[0].split("").map(show).join("") + '</b>', "Let's build the word " + word[0]);
        word[0].split("").forEach(l => {
          const sl = document.createElement("div");
          sl.className = "slot"; sl.dataset.want = l;
          drag.target(sl); slots.appendChild(sl);
        });
        shuffle(word[0].split("").concat(sample(st.letters, 2, word[0].split("")))).forEach((l, i) => {
          const t = makeTile(l, TILECOLORS[i % TILECOLORS.length]);
          drag.tile(t); wrap.appendChild(t);
        });
      }
      nextWord();
    }

    /* 4 — read it for real */
    function readPhase(){
      const sent = pick(st.read);
      const rd = document.createElement("div"); rd.className = "reader";
      sent.split(" ").forEach(w => {
        const b = document.createElement("button");
        b.className = "rword"; b.textContent = w;
        const clean = w.replace(/[^A-Za-z]/g, "").toLowerCase();
        b.addEventListener("click", () => {
          document.querySelectorAll(".rword").forEach(x => x.classList.remove("lit"));
          b.classList.add("lit"); b.classList.add("read");
          if(clean.length > 1 && clean.length <= 4 && clean.split("").every(c => BY[c])){
            say("", {now:true});
            clean.split("").forEach(c => { say(BY[c].sound, {rate: 0.55}); pause(200); });
            pause(450); say(clean + "!", {rate: 0.8});
          } else {
            say(clean, {now:true});
          }
        });
        rd.appendChild(b);
      });
      const done = document.createElement("button");
      done.className = "pill"; done.textContent = "I read it! ⭐";
      done.addEventListener("click", () => { addStar(3); run(4); });
      box.append(coachLine("point under each word as she sounds it out. Tap any word to hear it blended."), rd, done);
      setPrompt('Read it together', "");
      beats(["Now let's read it together!", 300, {t: sent, rate: 0.68}, 260,
             "Tap a word if you want to hear it again."], true);
    }

    function finish(){
      S.lessons[currentStep] = true; save();
      cheer("You read it! 📖", STEP_NAMES[currentStep] + " finished.", 3200);
      afterSpeech(goHome);
    }

    run(0);
  }
};

/* =====================================================================
   STICKERS — five stars buys one. Something that visibly accumulates
   is worth more to a five-year-old than any number.
   ===================================================================== */
const STICKER_SET = ["🌟","🦄","🐣","🌈","🍩","🐙","🚀","🦖","🌻","🐝",
                     "🍓","🐬","🎈","🦋","🧁","🐼","🎨","🦉","🍀","🐧"];
const STICKER_EVERY = 5;
function checkSticker(){
  const earned = Math.floor(S.stars / STICKER_EVERY);
  let got = null;
  while(S.stickers.length < earned){
    got = STICKER_SET[S.stickers.length % STICKER_SET.length];
    S.stickers.push(got);
  }
  if(got){
    save(); renderStickers(); sfxSticker(); pipFace("party", 2000);
    cheer(got + " New sticker!", "Five more stars. It is in your sticker book.", 2400);
    say("You earned a sticker! Well done" + (kidName() ? ", " + kidName() : "") + ".");
  }
  return got;
}
function renderStickers(){
  const el = document.getElementById("stickerBook"); if(!el) return;
  const prog = S.stars % STICKER_EVERY;
  const left = STICKER_EVERY - prog;
  el.innerHTML =
    (S.stickers.length
      ? S.stickers.map((e,i) => '<span class="sticker" style="--tilt:' + (((i*37) % 13) - 6) + 'deg">' + e + '</span>').join("")
      : '<span class="empty">Play a game to win your first sticker!</span>') +
    '<span class="next">' + left + (left === 1 ? ' more star' : ' more stars') +
      '<span class="meter"><i style="width:' + (prog / STICKER_EVERY * 100) + '%"></i></span></span>';
}

/* =====================================================================
   A star that flies to the counter, so earning one is an event
   ===================================================================== */
let lastPt = {x: innerWidth/2, y: innerHeight/2};
addEventListener("pointerdown", e => { lastPt = {x: e.clientX, y: e.clientY}; }, true);
function bumpStars(){
  const t = document.querySelector(".stars"); if(!t) return;
  t.classList.add("bump"); setTimeout(() => t.classList.remove("bump"), 430);
}
function flyStar(){
  const target = document.querySelector(".stars");
  if(reduceMotion || !target){ bumpStars(); return; }
  const r = target.getBoundingClientRect();
  const el = document.createElement("div");
  el.className = "flystar"; el.textContent = "⭐";
  el.style.left = (lastPt.x - 17) + "px";
  el.style.top  = (lastPt.y - 17) + "px";
  document.body.appendChild(el);
  requestAnimationFrame(() => {
    el.style.transform = "translate(" + (r.left + r.width/2 - lastPt.x) + "px," +
                                        (r.top + r.height/2 - lastPt.y) + "px) scale(.4)";
    el.style.opacity = "0.25";
  });
  setTimeout(() => { el.remove(); bumpStars(); }, 720);
}

/* =====================================================================
   PIP'S WELCOME
   ===================================================================== */
function pipGreeting(){
  const n = kidName();
  const hi = n ? ["Hello, " + n + "!", "Hi " + n + "!", "There you are, " + n + "!"] : ["Hello!", "Hi there!", "Oh, hello!"];
  return pick(hi) + " " + pick([
    "I'm Pip. Shall we play with some letters together?",
    "I'm so glad you came back. Which game shall we play?",
    "I'm Pip the owl. Pick a game and I'll help you.",
    "Ready to find some letters with me?",
    "I've been waiting for you. Let's learn some sounds!"
  ]);
}
function pipHello(speakIt){
  const el = document.getElementById("pipSays");
  if(!el) return;
  const line = pipGreeting();
  el.textContent = line;
  if(speakIt) say(line, {now:true});
}

const sheetHost = document.getElementById("sheetHost");
function closeSheet(){ sheetHost.innerHTML = ""; }
function openSheet(html, wire){
  sheetHost.innerHTML = '<div class="scrim"><div class="sheet" role="dialog" aria-modal="true">' + html + '</div></div>';
  const scrim = sheetHost.querySelector(".scrim");
  scrim.addEventListener("click", e => { if(e.target === scrim) closeSheet(); });
  if(wire) wire(sheetHost);
}
function seg(name, options, value){
  return '<div class="seg">' + options.map(o =>
    '<button data-seg="' + name + '" data-val="' + o[0] + '" aria-pressed="' + (o[0] === value) + '">' + o[1] + '</button>'
  ).join("") + '</div>';
}
document.getElementById("settingsBtn").addEventListener("click", () => {
  openSheet(
    '<h2>Settings</h2><p class="sub">Set it up the way her class does it.</p>' +
    '<div class="row"><span class="lab">Her name</span>' +
      '<input class="pill" id="kidName" type="text" maxlength="14" placeholder="(optional)" ' +
      'value="' + (S.kidName || "").replace(/"/g, "&quot;") + '"></div>' +
    '<div class="row"><span class="lab">Letters look like</span>' + seg("caseMode", [["upper","A B C"],["lower","a b c"],["both","A a B b"]], S.caseMode) + '</div>' +
    '<div class="row"><span class="lab">Voice</span>' + seg("speech", [[ "on","On"],["off","Off"]], S.speech ? "on" : "off") + '</div>' +
    '<div class="row"><span class="lab">How Pip talks</span>' +
      seg("style", [["teacher","Teacher"],["simple","Simple"]], S.style) + '</div>' +
    '<p class="sub" style="margin:-6px 0 10px;font-size:14px">Teacher talks slowly and sing-song, says each sound three times, ' +
      'and then waits for her to say it back out loud. Simple just says it once.</p>' +
    '<div class="row"><span class="lab">Fun sounds</span>' + seg("sfx", [["on","On"],["off","Off"]], S.sfx ? "on" : "off") + '</div>' +
    '<div class="row"><span class="lab">Which voice</span><select class="pill" id="voiceSel"></select>' +
      '<button class="pill" id="tryVoice">Hear it</button></div>' +
    '<div id="voiceNote"></div>' +
    '<div class="row"><span class="lab">Voice speed</span>' + seg("rate", [["0.7","Slow"],["0.82","Just right"],["0.95","Quick"]], String(S.rate)) + '</div>' +
    '<div class="row"><span class="lab">Start over</span><button class="pill" id="resetBtn">Clear stars</button></div>' +
    '<div class="row" style="justify-content:flex-end"><button class="pill" id="doneBtn">Done</button></div>',
    host => {
      host.querySelectorAll("[data-seg]").forEach(b => b.addEventListener("click", () => {
        const k = b.dataset.seg, v = b.dataset.val;
        if(k === "caseMode") S.caseMode = v;
        if(k === "speech")   S.speech = (v === "on");
        if(k === "sfx")      { S.sfx = (v === "on"); if(S.sfx) sfxGood(); }
        if(k === "style")    { S.style = v; sayFull("m", {now:true}); }
        if(k === "rate")     S.rate = parseFloat(v);
        save();
        host.querySelectorAll('[data-seg="' + k + '"]').forEach(o => o.setAttribute("aria-pressed", o === b));
        if(k === "rate" || k === "speech") say("Hello! This is my voice.", {now:true});
      }));
      /* Voice quality is decided almost entirely by which voice is
         installed, and that varies by machine, so let them hear and choose. */
      const nameIn = host.querySelector("#kidName");
      nameIn.addEventListener("input", () => { S.kidName = nameIn.value; save(); });
      nameIn.addEventListener("change", () => {
        if(kidName()) say("Hello, " + kidName() + "! It's lovely to meet you.", {now:true});
      });
      const sel = host.querySelector("#voiceSel");
      const note = host.querySelector("#voiceNote");
      function populate(){
        const vs = rankedVoices();
        if(!vs.length){
          sel.innerHTML = '<option>No voices installed</option>';
          sel.disabled = true;
          note.innerHTML = '<div class="notice">This browser has no speech voices installed, so the app will be silent. ' +
            'On a Chromebook they are built in. On Arch Linux, the most human-sounding ones are ' +
            '<code>sudo pacman -S speech-dispatcher rhvoice rhvoice-language-english rhvoice-voice-slt</code> ' +
            '— then restart the browser and pick one here.</div>';
          return;
        }
        sel.disabled = false;
        note.innerHTML = "";
        sel.innerHTML = vs.map(v =>
          '<option value="' + v.name.replace(/"/g,"&quot;") + '">' +
          v.name.replace(/</g,"&lt;") + ' (' + v.lang + ')</option>').join("");
        sel.value = (voice && voice.name) || vs[0].name;
      }
      populate();
      if(!rankedVoices().length) setTimeout(populate, 700); /* voices often arrive late */
      sel.addEventListener("change", () => {
        S.voiceName = sel.value; save(); chooseVoice();
        say("B says ⟦b⟧, like ball!", {now:true});
      });
      host.querySelector("#tryVoice").addEventListener("click", () =>
        say("Hello! B says ⟦b⟧, like ball. Can you find the letter S?", {now:true}));
      host.querySelector("#doneBtn").addEventListener("click", () => { closeSheet(); if(!current) renderHome(); });
      host.querySelector("#resetBtn").addEventListener("click", e => {
        if(e.target.dataset.sure){
          S = Object.assign({}, defaults, {caseMode:S.caseMode, speech:S.speech, rate:S.rate,
                                           voiceName:S.voiceName, sfx:S.sfx, kidName:S.kidName,
                                           style:S.style, stickers:[], lessons:{}});
          save(); closeSheet(); renderHome();
        } else { e.target.dataset.sure = "1"; e.target.textContent = "Really clear? Tap again"; }
      });
    }
  );
});
document.getElementById("grownupsBtn").addEventListener("click", () => {

  openSheet(

    '<div class="grid26">' + ALPHA.map(l => '<span class="' + ((S.seen[l]||0) ? "done" : "") + '">' + l.toUpperCase() + '</span>').join("") + '</div>' +
    '<div class="row" style="border-top:3px dotted var(--manila-deep);margin-top:18px"></div>' +
    '<ul class="tips">' +
      '<li><b>Trackpad order.</b> Bubble Pop first (just moving the pointer), then Knock Knock, then the two dragging games. Trace a Letter is the hardest &mdash; it needs a click held down the whole way.</li>' +
      '<li><b>Every drag also works as two taps.</b> Tap the letter, then tap where it goes. Let her use that until the drag itself clicks.</li>' +
      '<li><b>Sounds, not names.</b> The voice says the <i>sound</i> a letter makes (&ldquo;mmm&rdquo;, not &ldquo;em&rdquo;) because that is what blends into words. Stretchy letters (m, s, f&hellip;) are held. p, t, k and h are whispered, with no voice, and b, d and g are kept as short as possible &mdash; never &ldquo;puh&rdquo; or &ldquo;buh&rdquo;, because the extra &ldquo;uh&rdquo; is what makes blending hard (&ldquo;buh-a-tuh&rdquo; is not &ldquo;bat&rdquo;). When she tries a sound, Pip says how the mouth makes it.</li>' +
      '<li><b>Saying it out loud is the point.</b> In Teacher style Pip models a sound three times, then stops and waits while a <i>Your turn!</i> badge shows on screen. That pause is deliberate — reading starts with making the sounds with her own mouth, not just recognising them. Switch to Simple in Settings if she would rather move quickly.</li>' +
      '<li><b>If the voice sounds robotic,</b> open Settings and try the other voices in the list — the ones marked <i>Natural</i>, <i>Neural</i> or <i>Online</i> are the human-sounding ones. On a Chromebook, more can be added under Settings &rarr; Accessibility &rarr; Text-to-speech.</li>' +
      '<li><b>Case.</b> Kindergarten usually starts in capitals. Switch to <i>A a B b</i> in Settings once she is matching both.</li>' +
      '<li><b>No losing.</b> A wrong answer never takes a star or ends a round &mdash; it just asks again.</li>' +
      '<li><b>Progress lives in this browser.</b> Stars and letters are stored on this device only, so her Chromebook and your machine keep separate counts.</li>' +
    '</ul>' +
    '<div class="row" style="justify-content:flex-end"><button class="pill" id="doneBtn2">Done</button></div>',
    host => host.querySelector("#doneBtn2").addEventListener("click", closeSheet)

  ac();                       /* the first tap is also the permission for sound */
